# 実行ファイル隣のconf/*.tomlを起動時に読みます。変更後は再起動してください。
# *.toml.sampleは見本で、読み込みません。通常使う項目だけを掲載しています。
# 通信・保存・再接続の待ち時間などは従来の標準値を内部で使用します。

[startup]
# run: 運転 / check: 設定検査 / probe: 読取接続検査 / diagnostics: 診断ZIPの出力。引数は不要です。
# diagnosticsでは必要時だけ diagnostic_session = "2026-10-26_Day" を追加。省略なら最新場。
# 通常運転へ戻す際はdiagnostic_sessionを削除。診断は注文も取消も行いません。
action = "check"

[controller]
# kabus-controllerの接続先。APIパスやAPIキーは付けません。
base_url = "http://10.10.100.1:8080"

[trading]
# trueは仮想売買、falseは実注文。仮想売買にも現在データの読取接続は必要です。
dryrun = true
# 保存先を区別するID。旧注文取消と監査履歴のため同じIDを維持します。半角英数字・_・-。
# 毎起動で戦略・仮想玉を初期化し、旧実玉は手動管理。今回の建玉だけをID別に管理します。
instance_id = "topix-mini"

[schedule]
# 立会終了の何秒前に全玉の返済を要求するか。600は10分前。立会時刻自体はAPIから取得します。
force_close_before_seconds = 600
# 日中の未参加補完を許可する時刻（日本時間HH:MM）。時刻だけで必ず発注する意味ではありません。
day_extra_jst = "12:30"
# 米国現物開始の基準（冬の日本時間HH:MM）。米国夏時間には自動で1時間早め、22:30になります。
# 夜間主担当の静観・準備、および日経の未参加補完の基準です。
us_open_jst = "23:30"
# 日経の夜間未参加補完を、上の米国開始時刻から何分後に許可するか（0〜240分）。
us_extra_delay_minutes = 30
# TOPIXの夜間未参加補完の時刻（冬の日本時間HH:MM）。01:30は夜間開始日の翌日です。
# 英国夏時間には自動で1時間早め、翌00:30になります。米国とは別の日程で切り替えます。
london_extra_jst = "01:30"

# 1つの実行フォルダで1商品を売買します。判断には二市場のラージ板を使います。
[market]
# TOPIX / TOPIXmini / NK225 / NK225mini / NK225micro のいずれか一つ。
# 約定・発注は選択商品、判断はTOPIXラージと日経225ラージです。
product = "TOPIXmini"
# 今回の起動で建てる買い・売りそれぞれの上限（枚、1以上）。未約定新規を含みます。
# 旧玉・手動玉は上限と返済対象から除外。手動1枚＋システム10枚＝口座11枚でも運転します。
# 枚数変更は再起動で反映。返済した分は再び新規に使えます。
# 主担当・未参加補完は各々この半分（端数切捨て・最低1枚）を基準に、同方向の合計を制限します。
# 商品規格は内部の標準値、銘柄ID・限月はAPIの取得値を使用します。
max_per_side = 10

# 手法IDは主担当と未参加補完を含む組合せです。細かな係数をここで調整する必要はありません。
# 00131で選んだ既存手法を、そのままIDで指定します。商品や昼夜に合わないIDは起動時に拒否します。
[methods]
# 日中の手法。T06: 二市場の方向へ追従し、逆行継続で撤退。未参加なら一度だけ補完します。
# TOPIX・日経の両方に対応し、銘柄別の確認秒数は手法に含まれます。
day = "T06"
# 夜間の手法。TOPIX系はT04（二市場の突破確認）、日経系はU06（突破後の押し戻り・再進行）。
# どちらも未参加補完とトレーリング返済を含みます。日経へ商品を変更するときはU06にします。
night = "T04"

