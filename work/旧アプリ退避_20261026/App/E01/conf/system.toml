# ファイル名順でconf/*.tomlを結合します。同じテーブルを重複させないでください。
[CONTROLLER]
BaseURL = "http://10.10.100.1:8080"
RequestTimeoutSeconds = 10
CandlePollSeconds = 10
OrderPollSeconds = 2
ReconnectSeconds = 3

[RUNTIME]
LogDirectory = "log"
StateDirectory = "state"
MaxPriceAgeSeconds = 30
StaleSeconds = 60
ReconnectGraceSeconds = 180
WarmupSeconds = 120
ForceCloseBeforeSeconds = 600
ShutdownTimeoutSeconds = 20
CheckpointSeconds = 2
StatusSeconds = 10
EntryOrderTimeoutSeconds = 10
AccountMaxAgeSeconds = 15
