# 各項目の説明を付けています。既存の設定値は保持しています。
# 実行ファイルと同じフォルダにある conf/*.toml を、起動時に一度読み込みます。
# *.toml.sample は説明用の見本で、読み込みません。編集を反映するには再起動します。
# コメントだけの変更は動作・保存状態の設定照合に影響しません。
# 接続先URL、[trading]、[schedule]、商品・数量・商品規格、[algorithm]の有効な設定値は
# 保存状態と照合します。照合対象を変更して同じ台帳を再開すると、設定不一致で停止します。

# ----------------------------------------
# 起動後に何をするか。運転以外の検査・旧版移行も、引数ではなくここで選びます。
[startup]
# run: 売買判断を続ける。実注文の有無は trading.dryrun で決まります。
# check: 設定だけを検査して終了。API接続や注文は行いません。
# probe: 登録銘柄・口座・足・板の読取接続を検査して終了。注文・取消・台帳更新は行いません。
# migrate_legacy: legacy_conf の旧設定と照合して旧台帳を複製移行。注文・取消は行いません。
# 空文字は不可です。検査・移行後に通常運転する際は run に戻します。
  action = "run"
# 運転開始から停止要求までの秒数。履歴準備の時間も含みます。
# 0は時間制限なし。正数は action="run" かつ dryrun=true のときだけ使えます。
# 期限後は返済・注文照合を試みるため、実際の終了には shutdown_seconds 等の時間が加わります。
  duration_seconds = 0.0
# 旧版の設定一式（*.toml）を退避したフォルダ。相対パスは実行ファイルのフォルダ基準です。
# action="migrate_legacy" のときだけ必須。それ以外は空文字にします。
# 旧台帳の場所は旧設定から解決し、元の台帳は残します。新しい保存先が既存なら移行しません。
  legacy_conf = ""

# ----------------------------------------
# kabus-controller への接続。APIキー・ログイン情報は controller 側が管理します。
[controller]
# 接続先の http(s) URL。APIパス・認証情報・クエリを付けず、ホストと必要ならポートを指定します。
# 空文字は不可。この接続先から市場データ・口座情報を取得し、実運転では透過APIで発注します。
  base_url = "http://10.10.100.1:8080"
# 通常のAPI要求1回、および板PUSHの接続開始に許す通信時間（秒、0不可）。
# 注文の約定待ち期限ではありません。通信期限超過でも発注済みの可能性は照合し続けます。
  request_timeout_seconds = 15.0
# 起動・再同期で取得する、各市場の過去生板API要求1回の通信期限（秒、0不可）。
# 履歴を読んだ後の指標計算も含めた、準備処理全体の制限時間ではありません。
  history_timeout_seconds = 180.0
# 登録銘柄と注文・建玉・立会情報を一組取得した後、次の照会まで待つ秒数（0不可）。
# API通信に要した時間は別なので、実際の更新周期はこの値より長くなることがあります。
  account_poll_seconds = 2.0
# 両ラージの1分足・5分足を一組取得した後、次の照会まで待つ秒数（0不可）。
# 売買判断に使える確定足を更新します。生板PUSHの受信間隔を指定する項目ではありません。
  candle_poll_seconds = 10.0
# 板PUSHが切れた後、再接続を始めるまで待つ秒数（0不可）。
# 注文送信でエラーが出た後の処理待機にも使います。結果不明の同一注文を自動再送はしません。
  reconnect_seconds = 3.0

# ----------------------------------------
# 実注文か仮想売買か、および保存状態を区別する運転ID。
[trading]
# true: 現在データで仮想約定を記録し、実注文・取消は送信しません。
# false: 口座・板等の前提が揃うと、新規・返済・取消を実際に送信します。
# 仮想売買でも controller の読取接続は必要です。true/false 以外や空文字は不可です。
  dryrun = true
# この運転の保存先を区別するID。ASCII英数字・_・-の1〜64文字（Windows予約名は不可）。
# 大文字は小文字へ統一。空文字・省略時は選択商品名の小文字（例: topixmini）になります。
# 再開時は同じIDを使います。別IDは別台帳であり、以前の保有状態を自動で引き継ぎません。
# 二商品を同時に動かす場合は、実行ファイルを含むフォルダを二つ用意してIDも分けます。
  instance_id = "topix-mini"

# ----------------------------------------
# 保存先、情報の鮮度、停止・復旧の待ち時間。秒数の項目はすべて正数で、0で無効化はできません。
[runtime]
# SQLiteの保存先。相対パスは実行ファイルのフォルダ基準。絶対パスも可、空文字は不可です。
# 下に {dryrun又はlive}/{instance_id}/market.sqlite と {商品名}.sqlite を作ります。
# 市場入力・判断状態・注文・所有建玉を保持します。保存先を変えても旧状態は自動移行しません。
  data_directory = "data"
# CSV・JSONLの出力先。相対パスは実行ファイルのフォルダ基準。絶対パスも可、空文字は不可です。
# 下に {dryrun又はlive}/{instance_id}/{商品名}/場名.csv・場名.jsonl 等を作ります。
# 仮想約定は場名_dryrun.csv 等。共通受信・稼働記録は同じID配下の market/trace.jsonl です。
  log_directory = "log"
# 新規に使う板受信時刻とラージの価格時計について、許容する古さ（秒、0不可）。
# 両ラージ・発注商品の必要な気配が古ければ新規を止めます。仮想返済も新鮮な商品気配を待ちます。
# これだけでは保有を即返済しません。長い受信中断への返済要求は reconnect_grace_seconds です。
  quote_max_age_seconds = 30.0
# 口座応答と、controller 内の注文・建玉更新時刻に許容する古さ（秒、0不可）。
# 期限を超えた情報では新規・返済・取消の送信を待ちます。鮮度以外に接続・送信時間等も検査します。
  account_max_age_seconds = 15.0
# どちらかのラージ板を最後に受信してから、この秒数を超えると全担当の返済を要求します。
# 未受信ならアプリ運転開始から数えます。0不可、quote_max_age_seconds 以上が必要です。
# 価格が動かない秒数ではなく受信中断の秒数です。通信・口座状態により即約定は保証されません。
  reconnect_grace_seconds = 180.0
# 変更のある戦略状態をSQLiteへ定期保存する間隔（秒、0不可）。
# 注文や約定の重要状態はこの周期を待たずにも保存します。全ログの書込み間隔ではありません。
  checkpoint_seconds = 5.0
# 保有枚数・板の受信時刻・判断状況・待機理由を画面と稼働記録に出す間隔（秒、0不可）。
# 取引がなくても出力します。売買判断の実行周期ではありません。
  status_seconds = 30.0
# Ctrl+Cやduration_seconds満了後に、新規を止めて返済・注文照合を続ける猶予（秒、0不可）。
# 未返済・結果不明が残ると台帳へ保存してエラー終了します。期限内の返済完了を保証する値ではありません。
# 通信処理を強制打切りする期限ではないため、実際の終了時刻はこの秒数を超える場合があります。
  shutdown_seconds = 30.0
# 未送信の新規判断を待たせられる秒数（0不可）。超過した新規判断は破棄し、再判断を待ちます。
# 送信後は新規・返済の両方について、同じ秒数を過ぎた未完了注文へ取消を要求します。
# 送信可能時間の終わりが先なら期限を早めます。結果不明は再送せず、取消・約定結果を照合します。
# 損切り幅・保有時間ではなく、取消を要求しても直ちに注文が消えるとは限りません。
  entry_order_timeout_seconds = 15.0

# ----------------------------------------
# 売買の時刻。立会の開始・終了・注文送信可能時間は controller から取得します。
# 海外時刻は各地域の現地時間で指定し、米国と英国の夏時間をそれぞれ自動適用します。
[schedule]
# controller の立会終了の何秒前に、新規を止めて全担当の場内返済を要求するか（30〜3600秒）。
# 600なら10分前。0不可。決済済みになる時刻の保証ではなく、返済要求を始める時刻です。
  force_close_before_seconds = 600.0
# 上の強制返済時刻の何秒前から、未参加時の追加担当による新規を打ち切るか（秒、0不可）。
# 両方600なら立会終了20分前が追加の締切。主担当の日中新規締切は algorithm 側の別設定です。
# algorithm に extra.entry_cutoff_seconds があれば、実際の追加判断ではその値を優先します。
  extra_cutoff_seconds = 600.0
# デイで、主担当がその場でまだ新規約定していない場合に追加担当を許可し始める日本時間（HH:MM）。
# 両銘柄共通。時刻になっても方向・指標・鮮度等が揃わなければ注文しません。空文字は不可です。
  day_extra = "12:30"
# 米国現物開始の基準となるニューヨーク現地時刻（HH:MM、空文字不可）。
# 夜間主担当の静観・準備時間、および日経の追加開始時刻の基準です。日本時間ではありません。
  us_open = "09:30"
# 日経の夜間追加担当を、us_open から何分後に許可し始めるか（0〜240分）。
# 0はus_openと同時。主担当が未参加の場合だけで、時刻だけでは発注しません。
  us_extra_delay_minutes = 30
# TOPIXの夜間追加担当を許可し始めるロンドン現地時刻（HH:MM、空文字不可）。
# 主担当が未参加の場合だけです。この時刻でロンドン市場の開始・終了を推定するものではありません。
  london_extra = "16:30"

# 1プロセスで売買する商品は一つです。判断用には両市場のラージ板を引き続き観測します。
# 実行ファイル隣の conf/*.toml だけを起動時に読み込み、*.toml.sample は読みません。
# 変更の反映には再起動が必要です。このファイルの有効な設定値は保存状態との照合対象なので、
# 変更して同じ台帳を再開すると設定不一致で停止します。コメントだけの変更は影響しません。

# ----------------------------------------
# 実際に売買する一商品と、主担当・追加担当の枚数。
[market]
# 発注商品。TOPIX / TOPIXmini / NK225 / NK225mini / NK225micro のいずれか一つ（空文字不可）。
# TOPIX系はTOPIXラージ、日経系はNK225ラージを自市場として判断し、相手のラージも参照します。
# 約定の判断・実注文には選択した商品の気配・銘柄IDを使い、限月・銘柄IDはAPIから取得します。
  product = "TOPIXmini"
# 買い・売りそれぞれの同時保有上限（枚、1〜1000000）。両方向合計ではありません。
# 主担当と追加担当の同方向保有・新規予約を合算して制限し、返済した分は再び新規に使えます。
# 実運転では同じ銘柄・限月の手動等の口座建玉も上限検査に含めます。1日合計の注文枚数ではありません。
  max_per_side = 10
# 主担当が1回の新規で求める基準枚数。正数なら1〜max_per_side、0なら上限の半分を自動配分。
# 半分の端数は切捨て、最低1枚です。上限10なら5枚。0は主担当の停止を意味しません。
# 実際は片方向の空き上限で制限され、部分返済後の枚数もこの基準から計算します。
  core_quantity = 0
# 主担当がその場でまだ新規約定していないときに、追加担当が一度だけ求める新規の最大枚数。
# 正数なら1〜max_per_side、0なら上限の半分（端数切捨て・最低1枚）。0は追加担当の停止ではありません。
# 値動きに応じた枚数調整と片方向の空き上限で減る場合があります。ナンピン1回当たりの枚数ではありません。
  extra_quantity = 0

# 商品別の呼値と円換算倍率。配下の商品名ごとの設定を使用します。
[products]
# 判断用にも使う日経225ラージの商品規格。
  [products.NK225]
# ラージの最小値幅（pt、正数・0不可）。判断中のティック単位の幅・最低停止幅等をptへ換算します。
    tick = 10.0
# 日経225ラージ1枚が1pt動いたときの損益（円/pt/枚、正数・0不可）。この商品の円換算に使います。
    point_value = 1000.0
# 日経225マイクロの商品規格。判断に使うのは日経ラージの板です。
  [products.NK225micro]
# 発注商品の最小値幅（pt、正数・0不可）。現行の成行発注では価格の丸めに使いません。
    tick = 5.0
# 日経225マイクロ1枚が1pt動いたときの損益（円/pt/枚、正数・0不可）。20枚なら1ptで200円です。
    point_value = 10.0
# 日経225ミニの商品規格。判断に使うのは日経ラージの板です。
  [products.NK225mini]
# 発注商品の最小値幅（pt、正数・0不可）。現行の成行発注では価格の丸めに使いません。
    tick = 5.0
# 日経225ミニ1枚が1pt動いたときの損益（円/pt/枚、正数・0不可）。ラージの10分の1です。
    point_value = 100.0
# 日経を運転するときは、上の product を "NK225micro"、max_per_side を20へ変更します。
# 両商品を同時に動かすには、実行ファイルを含む配布フォルダを二つ用意し、もう一方の
# [trading] の instance_id も "nk225-micro" 等にして、それぞれ引数なしで起動します。

# ----------------------------------------
# controller APIに円換算倍率がないため、以下だけを商品規格として設定します。
# APIのTradingUnitはこの円換算倍率ではありません。銘柄ID・限月・立会はAPIから取得します。
# point_value は「価格差1pt × 1枚」が何円か。損益は方向を加味した価格差×枚数×この値です。
# tick は価格の最小値幅（pt）。判断の値幅換算には両ラージのtickを使います。
# 現行は成行注文だけなので、ミニ・マイクロのtickによる指値価格の丸めは行いません。
# 選択商品の規格に加え、両ラージの規格も常に必要です。使用する規格の値は省略できません。

# 判断用にも使うTOPIXラージの商品規格。
  [products.TOPIX]
# ラージの最小値幅（pt、正数・0不可）。判断中のティック単位の幅・最低停止幅等をptへ換算します。
    tick = 0.5
# TOPIXラージ1枚が1pt動いたときの損益（円/pt/枚、正数・0不可）。この商品の円換算に使います。
    point_value = 10000.0
# TOPIXミニの商品規格。ラージと同じ指数価格でも1枚の損益倍率は異なります。
  [products.TOPIXmini]
# 発注商品の最小値幅（pt、正数・0不可）。現行の成行発注では価格の丸めに使いません。
    tick = 0.25
# TOPIXミニ1枚が1pt動いたときの損益（円/pt/枚、正数・0不可）。10枚なら1ptで10000円です。
    point_value = 1000.0

# 売買判断の調整用です。通常運用では、このファイルの数値例はコメントのままにします。
# 未指定の項目には、00131で選定した商品別・昼夜別の標準値を使用します。
# 行頭の # を外した項目だけ、選択中の商品について標準値を上書きします。
# 変更すると研究時の成績とは条件が変わります。反映は次の起動時です。
# キーは引用符で囲んだ「部門.変数」。数値を指定し、真偽値の項目は 0/1 です。
# 主担当は通常の売買、追加担当は主担当が未参加の場を補う売買です。
# ATRは確定済み足から算出する値動きの幅です。
# Rは注文準備時に決める基準幅で、円や固定ptではありません。
# 夜間主担当のRはATRと最低呼値幅の大きい方、追加担当では直近値幅も加味します。
# 以下は設定例です。有効にしても、未記載の他項目は標準値のままです。
[algorithm]

# 日中主担当の損切り幅を縮める際の下限（初期リスク幅に対する比率、0より大きく1以下）。
# 標準0.75。このATR縮小処理では、組の損失許容額を初期枚数×初期ATRの75%未満に縮めません。
# 他の返済条件や利益トレールは別に働くため、すべての返済幅の下限ではありません。
# 「価格の75%の損失を許容する」という意味ではありません。
# "day.risk_floor" = 0.75

# 日中主担当で、二市場の逆行が継続したとみなして返済を要求するまでの秒数。
# 単なる逆向きの1ティックではなく、逆行幅・正常気配などの条件も満たす必要があります。
# 標準はTOPIX系120秒、日経系60秒。この例を有効にすると日経系も120秒になります。
# "day.persistence_seconds" = 120

# 夜間主担当で、最高含み益が何Rに達したら利益保護トレールを開始するか（R倍率）。
# 標準1.0。1R到達で即利確するのではなく、そこから戻り幅を追跡します。
# "night.trail_start_r" = 1.0

# 夜間主担当で、最高含み益からどれだけ戻ると返済するか（R倍率）。標準0.75。
# 例：Rが4ptなら戻り幅3pt。小さくすると利益を早く守る一方、途中の揺れでも返済します。
# "night.trail_width_r" = 0.75

# 追加担当の初期損切り幅（R倍率）。日中・夜間とも標準1.0。
# 例：Rが4ptなら平均約定価格から4pt逆行すると返済を要求します。
# "extra.stop_r" = 1.0

# 追加担当で、最高含み益が何Rに達したら利益保護トレールを開始するか（R倍率）。
# 標準は日中1.0、TOPIX系夜間1.25、日経系夜間0.75。
# この例を有効にすると、選択中の商品の日中・夜間とも1.0になります。
# "extra.trail_start_r" = 1.0

# 追加担当で、最高含み益からどれだけ戻ると返済するか（R倍率）。
# 標準は日中0.5、TOPIX系夜間0.75、日経系夜間0.5。
# この例を有効にすると、選択中の商品の日中・夜間とも0.5になります。
# "extra.trail_width_r" = 0.5

# ATRの平滑化期間（5分足の本数、正の整数）。標準12本、約60分相当。
# 確定した5分足のTR（高安差と前足終値からの乖離を含む幅）をWilder方式で平滑化します。
# 単純な12本平均ではありません。
# 小さくすると最近の値動きに速く追従し、大きくするとゆっくり変わります。
# "features.atr_period" = 12
