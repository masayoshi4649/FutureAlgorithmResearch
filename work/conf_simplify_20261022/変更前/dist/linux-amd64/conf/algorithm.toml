# 各項目の説明を付けています。既存の設定値は保持しています。
# 売買判断の調整用です。通常運用では、このファイルの数値例はコメントのままにします。
# 未指定の項目には、00131で選定した商品別・昼夜別の標準値を使用します。
# 行頭の # を外した項目だけ、選択中の商品について標準値を上書きします。
# 変更すると研究時の成績とは条件が変わります。反映は次の起動時です。
# キーは引用符で囲んだ「部門.変数」。数値を指定し、真偽値の項目は 0/1 です。
# 主担当は通常の売買、追加担当は主担当が未参加の場を補う売買です。
# ATRは確定済み足から算出する値動きの幅です。
# Rは注文準備時に決める基準幅で、円や固定ptではありません。
# 夜間主担当のRはATRと最低呼値幅の大きい方、追加担当では直近値幅も加味します。
# 以下は設定例です。有効にしても、未記載の他項目は標準値のままです。
[algorithm]

# 日中主担当の損切り幅を縮める際の下限（初期リスク幅に対する比率、0より大きく1以下）。
# 標準0.75。このATR縮小処理では、組の損失許容額を初期枚数×初期ATRの75%未満に縮めません。
# 他の返済条件や利益トレールは別に働くため、すべての返済幅の下限ではありません。
# 「価格の75%の損失を許容する」という意味ではありません。
# "day.risk_floor" = 0.75

# 日中主担当で、二市場の逆行が継続したとみなして返済を要求するまでの秒数。
# 単なる逆向きの1ティックではなく、逆行幅・正常気配などの条件も満たす必要があります。
# 標準はTOPIX系120秒、日経系60秒。この例を有効にすると日経系も120秒になります。
# "day.persistence_seconds" = 120

# 夜間主担当で、最高含み益が何Rに達したら利益保護トレールを開始するか（R倍率）。
# 標準1.0。1R到達で即利確するのではなく、そこから戻り幅を追跡します。
# "night.trail_start_r" = 1.0

# 夜間主担当で、最高含み益からどれだけ戻ると返済するか（R倍率）。標準0.75。
# 例：Rが4ptなら戻り幅3pt。小さくすると利益を早く守る一方、途中の揺れでも返済します。
# "night.trail_width_r" = 0.75

# 追加担当の初期損切り幅（R倍率）。日中・夜間とも標準1.0。
# 例：Rが4ptなら平均約定価格から4pt逆行すると返済を要求します。
# "extra.stop_r" = 1.0

# 追加担当で、最高含み益が何Rに達したら利益保護トレールを開始するか（R倍率）。
# 標準は日中1.0、TOPIX系夜間1.25、日経系夜間0.75。
# この例を有効にすると、選択中の商品の日中・夜間とも1.0になります。
# "extra.trail_start_r" = 1.0

# 追加担当で、最高含み益からどれだけ戻ると返済するか（R倍率）。
# 標準は日中0.5、TOPIX系夜間0.75、日経系夜間0.5。
# この例を有効にすると、選択中の商品の日中・夜間とも0.5になります。
# "extra.trail_width_r" = 0.5

# ATRの平滑化期間（5分足の本数、正の整数）。標準12本、約60分相当。
# 確定した5分足のTR（高安差と前足終値からの乖離を含む幅）をWilder方式で平滑化します。
# 単純な12本平均ではありません。
# 小さくすると最近の値動きに速く追従し、大きくするとゆっくり変わります。
# "features.atr_period" = 12
