[[instruments]]
# 発注する商品名。TOPIXラージです。
product = "TOPIX"
# 商品別モード。off=停止、dryrun=仮想売買、live=実取引。画面から変更・保存できます。
mode = "off"
# この商品の片方向上限。返済した枚数は同じ運転内の新規に再利用できます。
max_per_side = 2
# 日中の手法名。TOPIX系はTOPIX_T06です。
day = "TOPIX_T06"
# 夜間の手法名。TOPIX系はTOPIX_T04です。
night = "TOPIX_T04"

[[instruments]]
# 発注する商品名。TOPIXminiです。
product = "TOPIXmini"
# 商品別モード。off=停止、dryrun=仮想売買、live=実取引。画面から変更・保存できます。
mode = "off"
# この商品の片方向上限。
