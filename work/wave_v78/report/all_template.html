[コンポーネント概要]
#ranking は固定した百六十二条件を商品・期間別に表示します。

<main><h1>全162条件の比較</h1><p><a id="main-link">主レポートへ</a></p><div class="intro">入口3 × 反対圧力への対応3 × 建値保護3 × 保有期限3 × 連敗休止2。全30場は既知資料です。</div><p class="small">金額利益割合は手数料後の利益÷（利益＋損失）。並べ替えは閲覧用で、代表選定には前16場だけを使います。</p>

<section class="panel"><h2>各条件の全セッション</h2><label>手法 <select id="method"></select></label><p id="description" class="small"></p><div id="sessions"></div></section><footer>表示は保存済み結果から生成。API取得・注文なし。</footer></main><script id="report-data" type="application/json">__DATA__</script><script>__SCRIPT__</script></body></html>
