# 手法IDで入口・途中判断・出口・担当配分の組合せを選びます。細かな係数の追加設定は不要です。
# TOPIX系はT06/T04、日経系の新規配布は昼夜D07。日経系ではTG04/PG04も昼夜に選べます。
# 手法IDを省略した旧設定は、従来のTOPIX T06/T04・日経T06/U06を維持します。
[methods]
# 日中の手法。T06は二市場追従と未参加補完。TG04は3担当、PG04は2担当を並行運転します。
# D07/TG04/PG04は日経系専用。利益確定後の1枚継続と、各担当固有の返済を含みます。
day = "T06"
# 夜間の手法。TOPIX系はT04。日経系はD07/TG04/PG04を選べます。
# D07/TG04/PG04は同じIDでも昼夜で内部の担当手法が切り替わります。旧U06も指定できます。
night = "T04"
