# このファイルはWeb版の設定見本です。実行ファイル隣のconf/settings.tomlにコピーして使用します。
# 実行設定はconf/*.toml、売買条件は以下で指定するTOMLです。変更後はアプリを再起動してください。

[rule_engine]
# D07の条件式ファイル。実行ファイル隣を基準にします。読込失敗時は起動しません。
file = "conf/rules/d07.toml"

[startup]
# run: Web画面 / check: 全商品の設定検査 / probe: 読取接続検査 / diagnostics: 診断ZIP出力。
action = "run"

[web]
# 画面の待受IP。127.0.0.1は同じPCだけ。LANから使う場合はそのPCのIPを指定します。
# 例: 10.10.100.1。0.0.0.0は全IPv4インターフェースです。
host = "127.0.0.1"
# Web画面のポート番号（1〜65535）。controllerの8080とは別の番号にします。
port = 8090

[controller]
# kabus-controllerの接続先。APIパスやAPIキーは付けません。
base_url = "http://10.10.100.1:8080"

[trading]
# true: 全商品を仮想売買 / false: ONにした商品で実注文。画面からモードは変更できません。
dryrun = true

[schedule]
# 立会終了の何秒前に全玉の返済を要求するか。600は10分前。立会時刻はAPIから取得します。
force_close_before_seconds = 600
# 米国現物開始の基準（冬の日本時間）。米国夏時間は自動で1時間早め、22:30になります。
us_open_jst = "23:30"

# 全5商品を一つずつ記載します。新規・追加のON/OFFは画面で変更できます。
# OFFにしても保有玉の返済監視は継続します。画面操作は保存せず、再起動は以下のenabledへ戻ります。
# 判断板は日経225とTOPIXのラージを使用し、発注・約定・建玉IDは商品ごとに分離します。
[[instruments]]
# 発注する商品名。日経225ラージです。
product = "NK225"
# 起動時の新規取引許可。falseなら初回ON操作までこの商品の運転を開始しません。
enabled = false
# 今回の運転が所有する買い・売りそれぞれの上限枚数。未約定新規も含み、旧玉・手動玉は除きます。
max_per_side = 2
# 日中の手法ID。日経系はD07/TG04/PG04/従来T06に対応します。
day = "D07"
# 夜間の手法ID。日経系はD07/TG04/PG04/従来U06に対応します。
night = "D07"

[[instruments]]
# 発注する商品名。日経225miniです。
product = "NK225mini"
# 起動時はOFF。画面でONにすると履歴を準備して新規・追加を許可します。
enabled = false
# この商品の片方向上限。D07は10枚を基本5・追加3・別入口2へ配分します。
max_per_side = 10
# 日中の手法ID。
day = "D07"
# 夜間の手法ID。同じIDでも昼夜で内部条件が切り替わります。
night = "D07"

[[instruments]]
# 発注する商品名。日経225microです。
product = "NK225micro"
# 起動時はOFF。画面のON/OFFはアプリ再起動時に引き継ぎません。
enabled = false
# この商品の片方向上限。ラージ・miniの上限とは別に管理します。
max_per_side = 20
# 日中の手法ID。
day = "D07"
# 夜間の手法ID。
night = "D07"

[[instruments]]
# 発注する商品名。TOPIXラージです。
product = "TOPIX"
# 起動時の新規取引許可。falseはOFFです。
enabled = false
# この商品の片方向上限。返済した枚数は同じ運転内の新規に再利用できます。
max_per_side = 2
# 日中の手法ID。TOPIX系はT06です。
day = "T06"
# 夜間の手法ID。TOPIX系はT04です。
night = "T04"

[[instruments]]
# 発注する商品名。TOPIXminiです。
product = "TOPIXmini"
# 起動時の新規取引許可。OFF後も、既に保有する玉は通常条件で返済します。
enabled = false
# この商品の片方向上限。
max_per_side = 10
# 日中の手法ID。
day = "T06"
# 夜間の手法ID。
night = "T04"
