# URL以外のAPIキー・ログイン情報はcontroller側が管理します。
[controller]
base_url = "http://10.10.100.1:8080"
request_timeout_seconds = 15
history_timeout_seconds = 180
account_poll_seconds = 2
candle_poll_seconds = 10
reconnect_seconds = 3

[trading]
dryrun = true

[runtime]
data_directory = "data"
log_directory = "log"
quote_max_age_seconds = 30
account_max_age_seconds = 15
reconnect_grace_seconds = 180
checkpoint_seconds = 5
status_seconds = 30
shutdown_seconds = 30
entry_order_timeout_seconds = 15

# 立会の開始・終了はcontrollerから取得。この表は売買判断の時計のみです。
[schedule]
force_close_before_seconds = 600
extra_cutoff_seconds = 600
day_extra = "12:30"
us_open = "09:30"
us_extra_delay_minutes = 30
london_extra = "16:30"
