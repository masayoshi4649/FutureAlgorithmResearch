<script>
'use strict';
const DATA=JSON.parse(document.getElementById('chart-data').textContent);
const $=id=>document.getElementById(id);
const colors={'entry-long':'#4bd3aa','entry-short':'#ff7d89','exit-long':'#8bc8ff','exit-short':'#f0c97e'};
let current,groups,selected=0,start=0,end=0,lo=0,hi=0,width=0,height=0,points=[],drag=null,moved=false;

/**
 * 機能: 数値を日本語表示に整える。
 * @param {number} value - 金額又は価格。
 * @param {boolean} signed - 正数へ符号を付けるか。
 * @returns {string} 桁区切り済み文字列。
 */
function num(value,signed=false){return (signed&&value>0?'+':'')+value.toLocaleString('ja-JP',{maximumFractionDigits:3});}
/**
 * 機能: UNIX秒を日本時間の時分秒へ変換する。
 * @param {number} t - UNIX秒。
 * @param {boolean} seconds - 秒も表示するか。
 * @returns {string} 日本時間の表示。
 */
function time(t,seconds=false){return new Date((t+32400)*1000).toISOString().slice(11,seconds?19:16);}
/**
 * 機能: 表示する銘柄と保存済み玉を準備する。
 * @returns {undefined} 返り値はなく画面を更新する。
 */
function load(){
 current=DATA.symbols[$('symbol').value];groups=current.groups;
 $('summary').textContent=current.label+'（ラージ）の1分足／売買：'+current.product+'　収支 '+num(current.summary.net,true)+'円　完結 '+current.lot_count+'枚・'+(current.lot_count*2)+'約定';
 const sorted=groups.map((r,i)=>[r,i]).sort((a,b)=>a[0].entry_row-b[0].entry_row);
 $('lot').replaceChildren(...sorted.map(([r,i])=>{const o=document.createElement('option');o.value=i;o.textContent=(r.side===1?'買':'売')+' '+r.entry_time+' '+num(r.entry_price)+' → '+r.exit_time+' '+num(r.exit_price)+'／'+r.quantity+'枚／'+num(r.net,true)+'円';return o;}));
 selected=$('symbol').value==='TOPIX'?groups.findIndex(r=>r.uids.includes(1)):groups.reduce((best,r,i)=>r.net<groups[best].net?i:best,0);
 $('lot').value=selected;setSelection();setView('all');
}
/**
 * 機能: 選択玉の実時刻・値幅・枚数と円損益を表示する。
 * @returns {undefined} 返り値はなく説明欄を更新する。
 */
function setSelection(){
 const r=groups[selected];$('lot').value=selected;
 $('selected').textContent=(r.side===1?'買い':'売り')+' '+r.entry_time+' @'+num(r.entry_price)+' → '+(r.side===1?'売り返済':'買い返済')+' '+r.exit_time+' @'+num(r.exit_price)+' ｜ '+num(r.points,true)+current.unit+' × '+r.quantity+'枚 ｜ 粗損益 '+num(r.gross,true)+'円 − 手数料 '+num(r.fees)+'円 ＝ '+num(r.net,true)+'円';
}
/**
 * 機能: 事前の表示範囲又は選択玉の前後へ移動する。
 * @param {string} mode - 全体・寄り・前場・後場・選択玉。
 * @returns {undefined} 返り値はなく再描画する。
 */
function setView(mode){
 const first=current.candles[0][0],last=current.candles.at(-1)[0]+60,r=groups[selected];
 [start,end]=mode==='open'?[first,first+1800]:mode==='morning'?[first,first+9900]:mode==='afternoon'?[first+13500,last]:mode==='selected'?[r.entry_epoch-300,r.exit_epoch+300]:[first,last];
 start=Math.max(first,start);end=Math.min(last,end);if(end-start<600){end=Math.min(last,start+600);start=Math.max(first,end-600);}
 document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===mode));draw();
}
/**
 * 機能: 高解像度の暗色Canvasを表示サイズに合わせる。
 * @param {HTMLCanvasElement} canvas - 描画先。
 * @returns {CanvasRenderingContext2D} 座標をCSSピクセルへ整えた描画文脈。
 */
function context(canvas){
 const ratio=window.devicePixelRatio||1,w=canvas.clientWidth,h=canvas.clientHeight;
 canvas.width=Math.round(w*ratio);canvas.height=Math.round(h*ratio);
 const ctx=canvas.getContext('2d');ctx.scale(ratio,ratio);ctx.fillStyle='#0e1a2b';ctx.fillRect(0,0,w,h);ctx.font='12px system-ui';return ctx;
}
/**
 * 機能: 時刻を価格図の横座標へ写す。
 * @param {number} t - UNIX秒。
 * @returns {number} CSSピクセル座標。
 */
function x(t){return 60+(t-start)/(end-start)*(width-80);}
/**

 */
function y(price){return 20+(hi-price)/(hi-lo)*(height-52);}
/**

 */

 groups.forEach(r=>{if(r.entry_epoch>=start&&r.entry_epoch<=end)values.push(r.entry_price);if(r.exit_epoch>=start&&r.exit_epoch<=end)values.push(r.exit_price);});
 lo=Math.min(...values);hi=Math.max(...values);const pad=Math.max((hi-lo)*0.09,current.unit==='pt'?1:10);lo-=pad;hi+=pad;
 ctx.strokeStyle='#2b394e';ctx.fillStyle='#aabdd5';ctx.textAlign='right';
 for(let k=0;k<=5;k++){const p=lo+(hi-lo)*k/5,yy=y(p);ctx.beginPath();ctx.moveTo(60,yy);ctx.lineTo(width-20,yy);ctx.stroke();ctx.fillText(num(p),54,yy+4);}
 const tick=end-start>12000?3600:end-start>3600?1800:end-start>1200?600:300;
 ctx.textAlign='center';for(let t=Math.ceil(start/tick)*tick;t<end;t+=tick){const xx=x(t);ctx.beginPath();ctx.moveTo(xx,20);ctx.lineTo(xx,height-32);ctx.stroke();ctx.fillText(time(t),xx,height-11);}
 ctx.save();ctx.beginPath();ctx.rect(59,14,width-78,height-45);ctx.clip();
 const body=Math.max(1,Math.min(15,(width-80)*60/(end-start)*0.68));
 for(const c of visible){const xx=x(c[0]+30);ctx.strokeStyle=ctx.fillStyle=c[4]>=c[1]?'#4bd3aa':'#ff7d89';ctx.beginPath();ctx.moveTo(xx,y(c[2]));ctx.lineTo(xx,y(c[3]));ctx.stroke();ctx.fillRect(xx-body/2,Math.min(y(c[1]),y(c[4])),body,Math.max(1,Math.abs(y(c[1])-y(c[4]))));}
 const chosen=groups[selected];ctx.setLineDash([6,4]);ctx.lineWidth=1.7;ctx.strokeStyle='#f4d38a';ctx.beginPath();ctx.moveTo(x(chosen.entry_epoch),y(chosen.entry_price));ctx.lineTo(x(chosen.exit_epoch),y(chosen.exit_price));ctx.stroke();ctx.setLineDash([]);ctx.lineWidth=1;
 points=[];
 groups.forEach((r,index)=>{for(const entry of [true,false]){
  const t=entry?r.entry_epoch:r.exit_epoch,p=entry?r.entry_price:r.exit_price,kind=(entry?'entry-':'exit-')+(r.side===1?'long':'short');
  if(t<start||t>end||!document.querySelector('[data-kind="'+kind+'"]').checked)continue;
  const xx=x(t),yy=y(p),size=index===selected?7:4.5;ctx.fillStyle=colors[kind];ctx.strokeStyle='#0e1a2b';ctx.beginPath();
  if(entry){const sign=r.side===1?-1:1;ctx.moveTo(xx,yy+sign*size);ctx.lineTo(xx-size,yy-sign*size);ctx.lineTo(xx+size,yy-sign*size);ctx.closePath();}else{ctx.arc(xx,yy,size,0,Math.PI*2);}
  ctx.fill();ctx.stroke();if(index===selected){ctx.strokeStyle='#ffedb9';ctx.lineWidth=2;ctx.beginPath();ctx.arc(xx,yy,10,0,Math.PI*2);ctx.stroke();ctx.lineWidth=1;}
  points.push({x:xx,y:yy,index,entry,t,kind});
 }});ctx.restore();
 drawInventory();window.chartViewReady=true;window.chartRenderedKey=$('symbol').value;window.chartShownCandles=visible.length;window.chartShownMarkers=points.length;
}
/**
 * 機能: 実約定順に再集計した買いと売りの保有枚数を階段線で表示する。
 * @returns {undefined} 返り値はなく下段のCanvasを更新する。
 */
function drawInventory(){
 const canvas=$('inventory'),ctx=context(canvas),h=canvas.clientHeight,cap=Math.max(current.summary.max_long,current.summary.max_short,1);
 ctx.fillStyle='#b7c9e0';ctx.fillText('保有枚数　買い（緑）／売り（赤）',65,17);ctx.textAlign='right';
 for(const n of [0,Math.ceil(cap/2),cap]){const yy=h-22-n/cap*(h-52);ctx.fillText(n+'枚',52,yy+4);ctx.strokeStyle='#2b394e';ctx.beginPath();ctx.moveTo(60,yy);ctx.lineTo(width-20,yy);ctx.stroke();}
 ctx.save();ctx.beginPath();ctx.rect(60,25,width-80,h-44);ctx.clip();
 for(const side of [1,2]){let previous=0;ctx.strokeStyle=side===1?'#4bd3aa':'#ff7d89';ctx.lineWidth=1.8;ctx.beginPath();for(const r of current.inventory){const xx=x(r[0]),yy=h-22-r[side]/cap*(h-52);ctx.lineTo(xx,h-22-previous/cap*(h-52));ctx.lineTo(xx,yy);previous=r[side];}ctx.lineTo(x(current.candles.at(-1)[0]+60),h-22-previous/cap*(h-52));ctx.stroke();}ctx.restore();
}
/**
 * 機能: カーソル近傍の約定を選び、実秒と玉別損益を表示する。
 * @param {PointerEvent} event - マウス又はタッチの座標。
 * @returns {Object|null} 最寄りの約定。近傍に無ければnull。
 */
function inspect(event){
 const box=$('price').getBoundingClientRect(),px=event.clientX-box.left,py=event.clientY-box.top;
 let nearest=null,distance=100;
 for(const p of points){const dd=(p.x-px)**2+(p.y-py)**2;if(dd<distance){distance=dd;nearest=p;}}
 const tip=$('tooltip');if(nearest){const r=groups[nearest.index];tip.textContent=(nearest.entry?'新規 ':'返済 ')+time(nearest.t,true)+'／'+r.quantity+'枚\n'+(r.side===1?'買い':'売り')+' '+r.entry_time+' @'+num(r.entry_price)+' → '+r.exit_time+' @'+num(r.exit_price)+'\n'+num(r.points,true)+current.unit+' × '+r.quantity+'枚／手数料後 '+num(r.net,true)+'円\n玉ID '+r.uids.join(',');tip.style.display='block';tip.style.left=Math.max(4,Math.min(width-310,px+12))+'px';tip.style.top=Math.max(4,Math.min(height-120,py+12))+'px';}else{tip.style.display='none';}
 const t=start+(px-60)/(width-80)*(end-start),minute=Math.floor(t/60)*60,c=current.candles.find(r=>r[0]===minute);
 $('readout').textContent=c?time(c[0])+'　始 '+num(c[1])+'／高 '+num(c[2])+'／安 '+num(c[3])+'／終 '+num(c[4]):'';return nearest;
}
/**
 * 機能: 横軸をデータ範囲内へ制限して描画する。
 * @returns {undefined} 返り値はなく表示範囲を更新する。
 */
function clamp(){const first=current.candles[0][0],last=current.candles.at(-1)[0]+60,span=Math.min(last-first,Math.max(600,end-start));start=Math.max(first,Math.min(last-span,start));end=start+span;draw();}

// ----------------------------------------
// 保存済み表示だけを変更する操作を接続する。
$('symbol').addEventListener('change',load);
$('lot').addEventListener('change',()=>{selected=Number($('lot').value);setSelection();draw();});
document.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click',()=>setView(b.dataset.view)));
document.querySelectorAll('[data-kind]').forEach(b=>b.addEventListener('change',draw));
$('price').addEventListener('pointerdown',e=>{drag={x:e.clientX,start,end};moved=false;$('price').setPointerCapture(e.pointerId);});
$('price').addEventListener('pointermove',e=>{if(drag){const dx=e.clientX-drag.x;if(Math.abs(dx)>4)moved=true;const shift=dx/(width-80)*(drag.end-drag.start);start=drag.start-shift;end=drag.end-shift;clamp();}else{inspect(e);}});
$('price').addEventListener('pointerup',e=>{if(!moved){const p=inspect(e);if(p){selected=p.index;setSelection();draw();}}drag=null;});
$('price').addEventListener('pointercancel',()=>{drag=null;});
$('price').addEventListener('pointerleave',()=>{$('tooltip').style.display='none';});
$('price').addEventListener('wheel',e=>{e.preventDefault();const rect=$('price').getBoundingClientRect(),fraction=Math.max(0,Math.min(1,(e.clientX-rect.left-60)/(width-80))),old=end-start,span=Math.max(600,Math.min(current.candles.at(-1)[0]+60-current.candles[0][0],old*(e.deltaY>0?1.25:0.8))),center=start+old*fraction;start=center-span*fraction;end=start+span;clamp();},{passive:false});
window.addEventListener('resize',draw);
load();
</script>
<script>
/**
 * 機能: Canvasが空でなく、足・約定・在庫の色が描かれたことを調べる。
 * 引数: id(string)はCanvasの要素ID。
 * 返り値: Objectは寸法、色数、価格及び約定用の着色画素数。
 */
function canvasEvidence(id){
 const canvas=document.getElementById(id),ctx=canvas.getContext('2d');
 const pixels=ctx.getImageData(0,0,canvas.width,canvas.height).data;
 const colors=new Set();let pricePixels=0,exitPixels=0;
 for(let i=0;i<pixels.length;i+=4){
  const r=pixels[i],g=pixels[i+1],b=pixels[i+2];colors.add((r<<16)|(g<<8)|b);
  if((Math.abs(r-75)<10&&Math.abs(g-211)<10&&Math.abs(b-170)<10)||(Math.abs(r-255)<10&&Math.abs(g-125)<10&&Math.abs(b-137)<10))pricePixels++;
  if((Math.abs(r-139)<10&&Math.abs(g-200)<10&&Math.abs(b-255)<10)||(Math.abs(r-240)<10&&Math.abs(g-201)<10&&Math.abs(b-126)<10))exitPixels++;
 }
 return {width:canvas.width,height:canvas.height,colors:colors.size,pricePixels,exitPixels};
}
/**
 * 機能: 両銘柄・全範囲・各トグル・玉選択・ズームを実DOMで検査する。
 * 引数: なし。公開HTMLに埋め込まれた値とその描画操作だけを使う。
 * 返り値: なし。結果をbody属性へ保存し、最後はTOPIXのUID1全体へ戻す。
 */
window.addEventListener('load',()=>{
 const checks=[],bySymbol={};
 const verify=(value,label)=>{if(!value)throw new Error(label);checks.push(label);};
 try{
  verify(window.chartViewReady===true,'初回Canvas描画終端');
  verify(document.getElementById('symbol').value==='TOPIX'&&groups[selected].uids.includes(1),'初期TOPIX選択UID1');
  verify(document.querySelectorAll('[data-view]').length===5,'五つの範囲ボタン');
  verify(document.querySelectorAll('[data-kind]').length===4,'新規返済と買売の四トグル');
  let weightedFills=0;
  for(const [key,candles,markers] of [['TOPIX',415,252],['NK225',413,278]]){
   const selector=document.getElementById('symbol');selector.value=key;selector.dispatchEvent(new Event('change'));
   verify(window.chartRenderedKey===key&&current===DATA.symbols[key],key+'銘柄切替');
   verify(current.candles.length===candles&&window.chartShownCandles===candles,key+'全体の足数');
   verify(current.groups.length*2===markers&&window.chartShownMarkers===markers,key+'全体の集約マーカー数');
   verify(document.getElementById('lot').options.length===current.groups.length,key+'全玉選択肢');
   const fills=current.groups.reduce((n,r)=>n+2*r.quantity,0);weightedFills+=fills;
   verify(fills===current.lot_count*2,key+'集約枚数と実約定数');
   const price=canvasEvidence('price'),inventory=canvasEvidence('inventory');
   verify(price.width>100&&price.height>100&&price.colors>30&&price.pricePixels>20&&price.exitPixels>10,key+'足と約定Canvasは空でない');
   verify(inventory.width>100&&inventory.height>50&&inventory.colors>20&&inventory.pricePixels>20,key+'両在庫Canvasは空でない');
   const ranges=[];
   for(const button of document.querySelectorAll('[data-view]')){
    button.click();
    verify(button.classList.contains('active')&&document.querySelectorAll('[data-view].active').length===1,key+'範囲選択 '+button.dataset.view);
    verify(Number.isFinite(start)&&Number.isFinite(end)&&end>start&&window.chartShownCandles>0,key+'範囲に足が残る '+button.dataset.view);
    ranges.push({mode:button.dataset.view,candles:window.chartShownCandles,markers:window.chartShownMarkers,start,end});
   }
   document.querySelector('[data-view="all"]').click();
   const toggles=[];
   for(const input of document.querySelectorAll('[data-kind]')){
    const side=input.dataset.kind.endsWith('long')?1:-1;
    const hidden=current.groups.filter(r=>r.side===side).length;
    input.checked=false;input.dispatchEvent(new Event('change'));
    verify(window.chartShownMarkers===markers-hidden&&points.every(p=>p.kind!==input.dataset.kind),key+'表示を外す '+input.dataset.kind);
    toggles.push({kind:input.dataset.kind,hidden,shown:window.chartShownMarkers});
    input.checked=true;input.dispatchEvent(new Event('change'));
    verify(window.chartShownMarkers===markers,key+'表示を復帰 '+input.dataset.kind);
   }
   for(const input of document.querySelectorAll('[data-kind]')){input.checked=false;input.dispatchEvent(new Event('change'));}
   verify(window.chartShownMarkers===0&&canvasEvidence('price').pricePixels>20,key+'全約定非表示でも足は残る');
   for(const input of document.querySelectorAll('[data-kind]')){input.checked=true;input.dispatchEvent(new Event('change'));}
   const lot=document.getElementById('lot'),previous=selected;
   lot.value=(selected+1)%current.groups.length;lot.dispatchEvent(new Event('change'));
   const chosen=groups[selected],description=document.getElementById('selected').textContent;
   verify(selected!==previous&&selected===Number(lot.value),key+'別の完結玉を選択');
   verify(description.includes(chosen.entry_time)&&description.includes(chosen.exit_time)&&description.includes(num(chosen.net,true)),key+'選択玉の時刻純損益を表示');
   document.querySelector('[data-view="selected"]').click();
   verify(chosen.entry_epoch>=start&&chosen.exit_epoch<=end,key+'選択玉の新規返済が範囲内');
   document.querySelector('[data-view="all"]').click();
   const before=end-start,box=document.getElementById('price').getBoundingClientRect();
   document.getElementById('price').dispatchEvent(new WheelEvent('wheel',{deltaY:-100,clientX:box.left+box.width/2,clientY:box.top+box.height/2,bubbles:true,cancelable:true}));
   verify(end-start<before&&end-start>=600,key+'ホイールで拡大');
   const zoomed=end-start;
   document.getElementById('price').dispatchEvent(new WheelEvent('wheel',{deltaY:100,clientX:box.left+box.width/2,clientY:box.top+box.height/2,bubbles:true,cancelable:true}));
   verify(end-start>zoomed&&end-start<=before+0.001,key+'ホイールで縮小');
   bySymbol[key]={candles,markers,weightedFills:fills,price,inventory,ranges,toggles,zoom:{before,zoomed,after:end-start}};
  }
  verify(weightedFills===630,'二商品の実約定630');
  const selector=document.getElementById('symbol');selector.value='TOPIX';selector.dispatchEvent(new Event('change'));
  document.querySelector('[data-view="all"]').click();window.scrollTo(0,0);
  verify(groups[selected].uids.includes(1)&&window.chartShownCandles===415&&window.chartShownMarkers===252,'撮影前TOPIX_UID1全体へ復帰');
  verify(getComputedStyle(document.documentElement).backgroundColor==='rgb(11, 19, 32)','暗色背景');
  verify(document.documentElement.scrollWidth<=innerWidth+1,'画面の横はみ出しなし');
  verify(visualErrors.length===0,'JS例外とconsoleErrorなし');
  document.body.dataset.visualQa=JSON.stringify({passed:true,checks,bySymbol,weightedFills,selectedUIDs:groups[selected].uids,viewport:{width:innerWidth,height:innerHeight,documentWidth:document.documentElement.scrollWidth},errors:visualErrors});
 }catch(error){
  document.body.dataset.visualQa=JSON.stringify({passed:false,checks,error:String(error),stack:error.stack,errors:visualErrors});
 }
});
</script></body>
</html>
