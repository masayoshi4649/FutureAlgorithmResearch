# すべての設定はこのファイルで変更できます。起動引数は使いません。
[server]
# 待受先とポート。別PCから開くときは起動PCのIP:8091へ接続します。
listen = "0.0.0.0:8091"

[paths]
# 生板の保存ルート。原板をコピーせず、そのまま読み取ります。
data_root = "S:/GitHub/masayoshi4649/JP_OSE_Data/future"
# リンク列挙ファイルと損益JSONLの相対パスを解決するルート。
resource_root = "S:/GitHub/masayoshi4649/FutureAlgorithmResearch"
# 最初に開くリンク列挙ファイル。空文字なら自動読込しません。
default_catalog = "アルゴリズム調査/00169_セッションと売買経路の可視化/比較.resources.json"

[viewer]
# 再表示を速めるメモリキャッシュの上限。ディスクへは保存しません。
cache_mb = 64
# PNG出力用の日本語TTF/TTC。空ならOS標準フォントを探索します。SVG・数値APIには不要です。
font_path = ""
